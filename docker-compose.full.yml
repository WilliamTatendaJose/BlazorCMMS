services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: blazorcmms-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd123
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrong@Passw0rd123" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - blazorcmms-network

  blazorapp1:
    image: ${DOCKER_REGISTRY-}blazorapp1
    container_name: blazorcmms-app
    build:
      context: .
      dockerfile: BlazorApp1/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_URLS=http://+:8080
      # Database Connection
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=BlazorCMMS_Docker;User Id=sa;Password=YourStrong@Passw0rd123;TrustServerCertificate=True;MultipleActiveResultSets=true;
      # Email Settings (optional - leave empty for development)
      - Email__ResendApiKey=
      - Email__FromEmail=dev@rbmcmms.local
      - Email__FromName=RBM CMMS Dev
      # WhatsApp Settings (optional)
      - WhatsApp__Enabled=false
      - WhatsApp__UseLLM=false
    ports:
      - "8080:8080"
    networks:
      - blazorcmms-network
    restart: unless-stopped

volumes:
  sqldata:
    name: blazorcmms-sqldata

networks:
  blazorcmms-network:
    name: blazorcmms-network
    driver: bridge
